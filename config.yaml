seed: 42
paths:
  data_raw: data/raw
  data_processed: data/processed
  splits_dir: data/splits
  results_dir: results
  plots_dir: results/plots
  metrics_dir: results/metrics
  checkpoints_dir: results/checkpoints
data:
  image_size:
  - 128
  - 128
  split_ratios:
  - 0.7
  - 0.15
  - 0.15
  num_workers: 0
  pin_memory: false
train:
  batch_size: 32
  epochs: 15
  early_stopping_patience: 5
baseline:
  hidden_dims:
  - 512
  - 128
  lr: 0.001
  weight_decay: 0.0001
  epochs: 12
cnn:
  channels:
  - 32
  - 64
  - 128
  - 256
  dropout: 0.4
  lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler: cosine
  epochs: 15
transfer:
  backbone: mobilenet_v2
  phase1_epochs: 5
  phase2_epochs: 6
  unfreeze_blocks: 3
  phase1_lr: 0.001
  phase2_lr: 5.0e-05
  dropout: 0.3
unet:
  encoder_channels:
  - 3
  - 32
  - 64
  - 128
  dice_weight: 0.5
  lr: 0.0003
  epochs: 6
  severity_thresholds:
    low_max: 0.05
    medium_max: 0.2
siamese:
  embedding_dim: 128
  margin: 1.0
  lr: 0.0003
  epochs: 6
autoencoder:
  latent_dim: 64
  lr: 0.0003
  epochs: 8
  anomaly_threshold: 0.1797645539045334
augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  color_jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.2
    hue: 0.05
  random_erasing: true
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
